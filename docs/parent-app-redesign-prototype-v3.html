<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>薯仔家长 V3 · 家庭主档案 + 题库分享原型</title>
<style>
:root{--ink:#17231f;--muted:#6c7b76;--line:#dfe7e3;--bg:#f3f6f4;--surface:#fff;--green:#0f6e56;--green-soft:#e7f4ef;--amber:#9a610c;--amber-soft:#fff4df;--red:#a63737;--red-soft:#fdecec;--blue:#316c8f;--blue-soft:#e9f3f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{color:inherit}.workspace{max-width:1240px;margin:auto;padding:24px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.intro h1{font-size:21px;margin:0}.intro p{margin:3px 0 0;color:var(--muted);font-size:12px}.version{font:12px ui-monospace,monospace;color:var(--muted)}.layout{display:grid;grid-template-columns:210px 370px minmax(300px,1fr);gap:22px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}.panel-title{font-size:11px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}.scenario,.mapbtn{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;text-align:left;padding:9px 10px;cursor:pointer;margin-bottom:3px}.scenario:hover,.mapbtn:hover{background:#f3f7f5}.scenario.on,.mapbtn.on{background:var(--green-soft);border-color:#acd9c9;color:var(--green);font-weight:650}.scenario small,.mapbtn small{display:block;color:var(--muted);font-weight:400;margin-top:1px}.rule{height:1px;background:var(--line);margin:14px 0}.side-note{font-size:11px;color:var(--muted);line-height:1.7}.phone{position:relative;width:360px;height:740px;margin:auto;border:9px solid #24312c;border-radius:32px;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 40px rgba(26,48,39,.13)}.status{height:25px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#52605b}.appbar{height:51px;padding:0 13px;border-bottom:1px solid #edf1ef;display:flex;align-items:center;gap:9px;flex:0 0 auto}.brandmark{width:28px;height:28px;border-radius:7px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:13px}.app-title{font-size:17px;font-weight:700;flex:1;min-width:0}.app-sub{font-size:10px;color:var(--muted);font-weight:400;display:block}.iconbtn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;display:grid;place-items:center;cursor:pointer;font-size:16px}.avatarbtn{border:0;background:var(--green-soft);color:var(--green);font-weight:700}.content{flex:1;overflow-y:auto;background:#f7f9f8;padding:13px 14px 22px;scrollbar-width:thin}.tabs{height:59px;border-top:1px solid var(--line);background:#fff;display:flex;flex:0 0 auto}.tab{flex:1;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}.tab b{font-size:18px;line-height:20px;font-weight:500}.tab.on{color:var(--green);font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:10px}.card.click{cursor:pointer}.card.click:hover{border-color:#9bcfbd}.card.tint{background:var(--green-soft);border-color:#c5e5d9}.card.warn{background:var(--amber-soft);border-color:#efd5a3}.card.danger{background:var(--red-soft);border-color:#efcaca}.eyebrow{font-size:11px;color:var(--muted);margin-bottom:3px}.title{font-size:15px;font-weight:700}.muted{font-size:12px;color:var(--muted)}.tiny{font-size:10px;color:var(--muted)}.row{display:flex;align-items:center;gap:9px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.grow{flex:1;min-width:0}.section{font-size:12px;color:var(--muted);margin:15px 2px 7px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;font-size:10px;background:#eef2f0;color:#53635d;white-space:nowrap}.chip.green{background:var(--green-soft);color:var(--green)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.red{background:var(--red-soft);color:var(--red)}.chip.blue{background:var(--blue-soft);color:var(--blue)}.btn{border:1px solid #cfdad5;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.tonal{background:var(--green-soft);border-color:#c5e5d9;color:var(--green)}.btn.danger{border-color:#ecc4c4;color:var(--red)}.btn.block{width:100%}.btn.sm{padding:5px 8px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin-bottom:11px}.field label{display:block;font-size:11px;color:#53635d;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #d7e1dc;border-radius:7px;padding:9px 10px;outline:none;background:#fff}.field input:focus{border-color:var(--green);box-shadow:0 0 0 2px #dff1ea}.progress{height:6px;background:#e8eeeb;border-radius:5px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--green)}.kidavatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-weight:800}.kidavatar.blue{background:var(--blue-soft);color:var(--blue)}.tvicon{width:43px;height:34px;border:3px solid #53635d;border-radius:5px;display:grid;place-items:center;font-size:10px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:11px 0}.listrow{padding:9px 0;border-bottom:1px solid #edf1ef}.listrow:last-child{border-bottom:0}.switch{width:38px;height:22px;border-radius:12px;background:#cbd6d1;padding:3px;cursor:pointer}.switch:after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(16px)}.banner{background:var(--amber-soft);border:1px solid #efd5a3;color:var(--amber);border-radius:7px;padding:8px 10px;font-size:11px;margin-bottom:10px}.family{background:#fff;border:1px solid #bdd8ce;border-radius:8px;padding:9px 11px;margin-bottom:11px}.family b{color:var(--green)}.modal{position:absolute;inset:0;background:rgba(20,31,27,.48);z-index:20;display:flex;align-items:flex-end}.sheet{width:100%;max-height:88%;overflow:auto;background:#fff;border-radius:14px 14px 0 0;padding:17px 16px 24px}.sheet h2{font-size:17px;margin:0 0 3px}.sheet ol{padding-left:19px;margin:10px 0}.sheet li{font-size:12px;color:#52615c;margin-bottom:6px}.toast{position:absolute;left:18px;right:18px;bottom:72px;z-index:30;background:#26332e;color:#fff;padding:9px 12px;border-radius:7px;font-size:12px;text-align:center}.empty{text-align:center;padding:44px 12px}.empty .symbol{font-size:38px;color:#8ba097}.notes h2{font-size:16px;margin:0 0 8px}.notes h3{font-size:12px;margin:17px 0 6px;color:var(--green)}.notes p,.notes li{font-size:12px;color:#52615c}.notes ul{padding-left:18px;margin:6px 0}.flow{display:grid;grid-template-columns:1fr;gap:7px}.flow div{border-left:3px solid #b6d9cc;background:#f7faf8;padding:7px 9px;font-size:12px}.changed{color:var(--green);font-weight:700}.diff{font:11px ui-monospace,monospace;background:#f7faf8;border:1px solid var(--line);border-radius:7px;padding:9px;margin:10px 0}.diff .old{color:var(--red)}.diff .new{color:var(--green)}@media(max-width:1040px){.layout{grid-template-columns:200px 370px}.notes{grid-column:1/-1}}@media(max-width:680px){.workspace{padding:12px}.intro{display:block}.version{margin-top:5px}.layout{grid-template-columns:1fr}.controls,.notes{display:none}.phone{width:min(360px,100%);height:calc(100vh - 90px);min-height:620px}}
</style>
</head>
<body>
<div class="workspace">
  <header class="intro"><div><h1>薯仔家长 V3 · 家庭主档案 + 题库分享</h1><p>档案属于家庭、分配到电视；跨家庭只分享题库副本；解绑只切断分配；保存带冲突保护。</p></div><div class="version">interactive prototype · 2026-11-13 · v3</div></header>
  <div class="layout">
    <aside class="panel controls">
      <div class="panel-title">体验场景</div>
      <button class="scenario on" data-scenario="active">已登录的多电视家庭<small>2 台电视、2 份家庭档案</small></button>
      <button class="scenario" data-scenario="returning">重装后的老用户<small>本机凭据丢失，先走恢复页</small></button>
      <button class="scenario" data-scenario="empty">新用户，无电视<small>空态直接提供下一步</small></button>
      <button class="scenario" data-scenario="admin">admin 只读代管<small>写操作禁用，仅可批准解锁</small></button>
      <div class="rule"></div>
      <div class="panel-title">页面地图</div>
      <button class="mapbtn" data-page="restore">账号恢复<small>重装不再误导重新绑机</small></button>
      <button class="mapbtn" data-page="today">今天<small>家庭聚合，时长全局累计</small></button>
      <button class="mapbtn" data-page="children">孩子<small>家庭档案，不按电视切分</small></button>
      <button class="mapbtn" data-page="child">孩子详情<small>规则唯一 + 分配 + 题库</small></button>
      <button class="mapbtn" data-page="quiz">题库与分享<small>本地题库 / 引用副本</small></button>
      <button class="mapbtn" data-page="devices">电视<small>设备列表与绑定</small></button>
      <button class="mapbtn" data-page="tv">电视设置<small>本台解锁方式 · 勾选分配 · 解绑确认</small></button>
      <button class="mapbtn" data-page="account">账号与设置<small>头像入口</small></button>
      <div class="rule"></div>
      <div class="panel-title">弹层演示</div>
      <button class="mapbtn" data-act="openUnlock">本台解锁方式<small>CR-02 · 仅当前电视生效</small></button>
      <button class="mapbtn" data-act="openConflict">保存冲突<small>查看差异 / 覆盖 / 放弃</small></button>
      <button class="mapbtn" data-act="openUnbind">解绑确认<small>S4 四条影响说明</small></button>
      <button class="mapbtn" data-act="openImport">引用他人题库<small>Q2 选择挂到哪个孩子</small></button>
      <p class="side-note">URL 支持 ?page=child&amp;scenario=active 直接定位截图。所有数据为虚构示例，仅用于交互评审。</p>
    </aside>
    <main>
      <div class="phone">
        <div class="status"><span>9:41</span><span>薯仔家长</span><span>5G&nbsp; 92%</span></div>
        <div class="appbar" id="appbar"></div>
        <div class="content" id="content"></div>
        <div class="tabs" id="tabs"></div>
        <div id="overlay"></div>
        <div id="toast"></div>
      </div>
    </main>
    <aside class="panel notes" id="notes"></aside>
  </div>
</div>
<script>
const state={page:'today',tab:'today',scenario:'active',loggedIn:true,loginMode:false,parentNo:'m10s',tv:0,editKid:1,modal:null,toast:'',dirty:false,saving:false,limitDraft:90,pickUnlock:0,
  tvs:[{name:'客厅电视',online:true,active:[1,2],mode:true,unlock:'远程确认',pin:''},{name:'卧室电视',online:false,active:[1],mode:true,unlock:'算术题',pin:''}],
  kids:[{id:1,name:'糖果',age:7,limit:90,used:52},{id:2,name:'测试1',age:9,limit:45,used:18}],
  quizzes:[{id:11,kidId:1,title:'识字卡 · 一年级',count:24,local:true,source:'本地题库',sharedTo:['grandpa99','mama88']},{id:22,kidId:2,title:'算术进阶',count:12,local:false,source:'来自 grandpa99 的题库副本',sharedTo:[]}],
  incoming:[{title:'成语接龙',count:30,from:'grandpa99'},{title:'古诗填空',count:18,from:'mama88'}]};
const pages=['today','children','devices'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ro=()=>state.scenario==='admin';
const dis=()=>ro()?' disabled':'';
const kid=id=>state.kids.find(k=>k.id===id);
const kidQuizzes=id=>state.quizzes.filter(q=>q.kidId===id);
const UNLOCKS=['远程确认','PIN 码','算术题','答题解锁'];
const UNLOCK_DESC=['家长手机点批准后，电视才继续播放','孩子在电视上输入本台 4–6 位数字','答对随机算术题后解锁','从当前选中孩子的家庭题库抽题作答'];
function toast(msg){state.toast=msg;render();clearTimeout(state.tt);state.tt=setTimeout(()=>{state.toast='';render()},2400)}
function setPage(p){state.page=p;if(pages.includes(p))state.tab=p;state.modal=null;state.dirty=false;render()}
function appbar(){
  if(state.page==='restore')return '<div class="brandmark">薯</div><div class="app-title">欢迎回来<span class="app-sub">恢复你的家庭档案与电视</span></div>';
  const titles={today:'今天',children:'孩子',child:'孩子详情',quiz:'题库与分享',devices:'电视',tv:'电视设置',account:'账号与设置'};
  const back=pages.includes(state.page)?'':'<button class="iconbtn" data-act="back" title="返回">‹</button>';
  const avatar=pages.includes(state.page)?'<button class="iconbtn avatarbtn" data-page="account" title="账号与设置">爸</button>':'';
  const tag=ro()?'<span class="chip amber">只读代管</span>':'';
  return back+'<div class="app-title">'+titles[state.page]+'</div>'+tag+avatar;
}
function tabs(){return pages.includes(state.page)?[['today','⌂','今天'],['children','♙','孩子'],['devices','▣','电视']].map(x=>'<button class="tab '+(state.tab===x[0]?'on':'')+'" data-page="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join(''):''}
function banner(){return ro()?'<div class="banner">只读代管：可查看全部电视、档案、题库与记录，不能修改配置；批准解锁请求仍是允许的例外。</div>':''}
function familyBar(){return '<div class="family"><div class="between"><div><div class="eyebrow">当前家庭</div><b>'+esc(state.parentNo)+'</b> <span class="tiny">· 档案全局唯一</span></div><span class="chip green">'+state.kids.length+' 份档案</span></div><div class="tiny" style="margin-top:4px">配额规则全家庭一致；解锁方式按台设置；跨家庭只分享题库</div></div>'}
function restore(){
  if(state.loginMode)return '<div class="section">登录已有家长号</div><div class="card"><div class="field"><label>家长号</label><input id="loginName" value="m10s"></div><div class="field"><label>口令</label><input id="loginPwd" type="password" value="12345678"></div><button class="btn primary block" data-act="login">登录并恢复</button></div><button class="btn block" data-act="cancelLogin">返回</button>';
  return '<div class="card warn"><div class="row"><div style="font-size:24px">↻</div><div><div class="title">检测到这是重新安装</div><div class="muted">本机没有保存过家长号，但你以前可能已经建立过家庭档案。</div></div></div></div><div class="section">你想怎么继续？</div><button class="card click" style="width:100%;text-align:left" data-act="showLogin"><div class="between"><div><div class="title">登录已有家长号</div><div class="muted">恢复家庭档案、电视分配与题库</div></div><span style="font-size:22px">›</span></div></button><button class="card click" style="width:100%;text-align:left" data-act="newAccount"><div class="between"><div><div class="title">创建新家长号</div><div class="muted">第一次使用，稍后扫码添加电视</div></div><span style="font-size:22px">›</span></div></button><div class="divider"></div><button class="btn block" data-act="deviceOnly">暂时使用本机账号</button><p class="tiny" style="text-align:center">本机账号不会自动看到原家长号的家庭档案。</p>';
}
function empty(){return '<div class="empty"><div class="symbol">▣</div><div class="title">还没有电视</div><p class="muted">家庭档案可以先建，但要应用到电视才生效。<br>以前绑定过电视，请先登录原家长号。</p><button class="btn primary block" data-act="showLogin">登录已有家长号</button><div style="height:8px"></div><button class="btn block" data-page="devices">扫码添加电视</button></div>'}
function today(){
  if(!state.loggedIn||state.scenario==='empty')return empty();
  return familyBar()+'<div class="between"><div><div class="eyebrow">家庭视图</div><div class="title">'+state.tvs.length+' 台电视 · 1 台在线</div></div><span class="chip green">实时同步</span></div><div class="section">待处理</div><div class="card warn"><div class="between"><div><b>1 条解锁请求</b><div class="muted">糖果 · 客厅电视 · 还剩 42 秒</div></div><button class="btn sm primary" data-act="unlock">批准</button></div></div><div class="section">孩子状态 · 全家庭累计</div>'+state.kids.map(k=>{const p=Math.min(100,Math.round(k.used/(k.limit||1)*100));return '<div class="card click" data-kid="'+k.id+'"><div class="row"><div class="kidavatar">'+esc(k.name[0])+'</div><div class="grow"><div class="between"><b>'+esc(k.name)+'</b><span class="chip green">今日 '+k.used+' / '+k.limit+' 分钟</span></div><div class="muted">客厅 + 卧室合并计算，换台不清零</div></div></div><div class="progress"><i style="width:'+p+'%"></i></div></div>'}).join('')+'<div class="section">最近观看</div><div class="card"><div class="listrow between"><span>糖果 · 客厅电视</span><span class="muted">32 分钟</span></div><div class="listrow between"><span>糖果 · 卧室电视</span><span class="muted">20 分钟</span></div><div class="listrow between"><span>测试1 · 客厅电视</span><span class="muted">18 分钟</span></div></div><div class="card tint"><b>时长只记在家庭自己的账上</b><div class="muted">别人引用了我们的题库，也不会把他们的观看时长算进来。</div></div>';
}
function children(){
  if(!state.loggedIn||state.scenario==='empty')return familyBar()+empty();
  return familyBar()+'<div class="between"><div><div class="title">家庭儿童档案</div><div class="muted">不属于任何一台电视，全家庭共用一份</div></div><button class="btn sm primary"'+dis()+' data-act="addKid">＋ 添加</button></div><div style="height:10px"></div>'+state.kids.map(k=>{const n=state.tvs.filter(t=>t.active.includes(k.id)).length,q=kidQuizzes(k.id).length;return '<div class="card click" data-kid="'+k.id+'"><div class="row"><div class="kidavatar">'+esc(k.name[0])+'</div><div class="grow"><div class="between"><b>'+esc(k.name)+'</b><span class="chip green">家庭主档案</span></div><div class="muted">'+k.age+' 岁 · 今日 '+k.used+' / '+k.limit+' 分钟</div></div><span style="font-size:20px">›</span></div><div class="between" style="margin-top:9px"><span class="chip blue">已分配到 '+n+' 台电视</span><span class="chip">题库 '+q+' 套</span></div></div>'}).join('')+'<div class="card tint"><b>配额规则只有一份</b><div class="muted">限额、禁看时段与频道白名单存家庭主档案，客厅和卧室不会出现两套配额规则。解锁方式属于电视，在「电视设置」里按台设置；电视页的勾选只决定哪些档案在这台启用。</div></div>';
}
function child(){
  const k=kid(state.editKid);if(!k)return '';
  const qs=kidQuizzes(k.id);
  return '<div class="card"><div class="between"><div><span class="chip green">家庭主档案</span><h2 style="margin:6px 0 0">'+esc(k.name)+'</h2><div class="muted">'+k.age+' 岁 · 全家庭唯一一份</div></div><button class="btn sm danger"'+dis()+' data-act="openDelete">删除档案</button></div></div>'+
  '<div class="section">规则 · 适用于家里所有电视</div><div class="card"><div class="field"><label>每日观看限额（分钟）</label><input id="limit" type="number" value="'+state.limitDraft+'"'+dis()+' data-draft="limit"></div><div class="listrow between"><span>禁看时段</span><b>21:30 – 07:00</b></div><div class="tiny" style="margin-top:8px">配额规则全家庭统一，按电视分别设限额的能力已下线。解锁方式不属于规则，在「电视设置」里按台设置。</div></div><div class="actions"><button class="btn sm" data-page="devices">去电视设置解锁方式</button></div>'+
  '<div class="section">分配到电视 · 每台独立勾选</div><div class="card">'+state.tvs.map((t,i)=>'<div class="listrow between"><span>'+esc(t.name)+'</span><div class="switch '+(t.active.includes(k.id)?'on':'')+'"'+dis()+' data-assign="'+i+'"></div></div>').join('')+'</div>'+

 const inc=e.target.closest('[data-incoming]');if(inc){state.pickIncoming=Number(inc.dataset.incoming);document.querySelectorAll('[data-incoming]').forEach(b=>b.classList.remove('tint'));inc.classList.add('tint');return}
 const un=e.target.closest('[data-unlock]');if(un){state.pickUnlock=Number(un.dataset.unlock);render();return}
 const as=e.target.closest('[data-assign]');if(as&&!ro()){const i=Number(as.dataset.assign),t=state.tvs[i],id=state.editKid;t.active=t.active.includes(id)?t.active.filter(x=>x!==id):[...t.active,id];render();return}
 const ta=e.target.closest('[data-tvassign]');if(ta&&!ro()){const id=Number(ta.dataset.tvassign),t=state.tvs[state.tv];t.active=t.active.includes(id)?t.active.filter(x=>x!==id):[...t.active,id];render();return}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(ro()&&['saveKid','addKid','doUnbind','doDelete','doImport','saveShare','saveUnlock','tvMode','scan','newAccount','deviceOnly','resolveOverwrite','resolveDrop'].includes(act)){toast('只读代管：不能修改配置');return}
 if(act==='back'){if(state.dirty){state.modal='draft';render();return}setPage(state.page==='child'||state.page==='quiz'?'children':state.page==='tv'?'devices':'today')}
 if(act==='showLogin'){if(state.page==='restore'){state.loginMode=true;render()}else{state.modal='login';render()}}
 if(act==='cancelLogin'){state.loginMode=false;render()}
 if(act==='login'){state.loggedIn=true;state.scenario='active';state.modal=null;state.loginMode=false;setPage('today');toast('已恢复家庭档案、2 台电视与题库')}
 if(act==='newAccount'){state.scenario='empty';state.loggedIn=true;setPage('today');toast('新家长号已创建')}
 if(act==='deviceOnly'){state.scenario='empty';state.loggedIn=false;setPage('today')}
 if(act==='unlock')toast('已批准，客厅电视恢复播放')
 if(act==='scan')toast('打开扫码器 · 示例不调用摄像头')
 if(act==='remote'){const t=state.tvs[Number(a.dataset.v||0)];toast('打开 '+(t?t.name:'')+' 遥控器')}
 if(act==='addKid')toast('打开新增家庭档案表单')
 if(act==='tvMode'){state.tvs[state.tv].mode=!state.tvs[state.tv].mode;render();toast('儿童模式已'+(state.tvs[state.tv].mode?'开启':'关闭')+'（仅本台）')}
 if(act==='openUnlock'){const t=state.tvs[state.tv]||state.tvs[0];state.pickUnlock=Math.max(0,UNLOCKS.indexOf(t.unlock));state.modal='unlock';render()}
 if(act==='saveUnlock'){const t=state.tvs[state.tv]||state.tvs[0];t.unlock=UNLOCKS[state.pickUnlock]||'远程确认';if(state.pickUnlock===1){const el=document.getElementById('unlockPin');if(el)t.pin=el.value}state.modal=null;render();toast('已保存 · 仅「'+t.name+'」生效，其它电视不受影响')}
 if(act==='saveKid'){if(state.saving)return;state.saving=true;const k=kid(state.editKid),v=Number(document.getElementById('limit').value);if(v>0){k.limit=v;state.limitDraft=v}state.saving=false;state.dirty=false;render();toast('已保存 · 规则同步到所有电视，题库授权名单未丢失')}
 if(act==='openShare'){state.editQuiz=Number(a.dataset.q);state.modal='share';render()}
 if(act==='saveShare'){const q=state.quizzes.find(x=>x.id===state.editQuiz);q.sharedTo=document.getElementById('shareNames').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);state.modal=null;render();toast('题库授权名单已保存')}
 if(act==='openImport'){state.pickIncoming=0;state.modal='import';render()}
 if(act==='doImport'){const src=state.incoming[state.pickIncoming||0],kidId=Number(document.getElementById('importKid').value);state.quizzes.push({id:Date.now(),kidId:kidId,title:src.title,count:src.count,local:false,source:'来自 '+src.from+' 的题库副本',sharedTo:[]});state.editKid=kidId;state.modal=null;setPage('quiz');toast('已复制副本到「'+kid(kidId).name+'」的题库')}
 if(act==='openUnbind'){state.modal='unbind';render()}
 if(act==='doUnbind'){const name=state.tvs[state.tv].name;state.tvs.splice(state.tv,1);state.tv=0;state.modal=null;setPage('devices');toast('已解绑 '+name+' · 家庭档案保留，今日时长不清零')}
 if(act==='openDelete'){state.modal='delete';render()}
 if(act==='doDelete'){const name=kid(state.editKid).name;state.quizzes=state.quizzes.filter(q=>q.kidId!==state.editKid);state.kids=state.kids.filter(k=>k.id!==state.editKid);state.tvs.forEach(t=>t.active=t.active.filter(id=>id!==state.editKid));state.editKid=state.kids[0]?state.kids[0].id:0;state.modal=null;setPage('children');toast('已删除家庭档案「'+name+'」')}
 if(act==='openConflict'){state.modal='conflict';render()}
 if(act==='openDiff'){state.modal='diff';render()}
 if(act==='backConflict'){state.modal='conflict';render()}
 if(act==='resolveOverwrite'){state.modal=null;state.dirty=false;render();toast('已用我的版本覆盖，服务端版本递增为 v19')}
 if(act==='resolveDrop'){const k=kid(state.editKid);state.limitDraft=k.limit;state.modal=null;state.dirty=false;render();toast('已放弃修改，页面恢复为服务端当前值')}
 if(act==='dropDraft'){state.limitDraft=kid(state.editKid).limit;state.dirty=false;state.modal=null;setPage('children')}
 if(act==='close'){state.modal=null;render()}
});
const q=new URLSearchParams(location.search);if(q.get('scenario')){state.scenario=q.get('scenario');state.loggedIn=state.scenario!=='returning'&&state.scenario!=='empty'}if(q.get('page')){state.page=q.get('page');if(pages.includes(state.page))state.tab=state.page}if(q.get('modal')){state.modal=q.get('modal');if(state.modal==='unlock')state.pickUnlock=Math.max(0,UNLOCKS.indexOf((state.tvs[state.tv]||{}).unlock))}if(state.page==='restore')state.loggedIn=false;state.limitDraft=kid(state.editKid)?kid(state.editKid).limit:90;render();
</script>
</body>
</html>
