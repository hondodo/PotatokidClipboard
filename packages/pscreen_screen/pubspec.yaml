name: pscreen_screen
description: 屏幕能力共享包（IPTV / 天气 / 时钟 / 消息协议 / 网络基础设施），只含能力层，不含 UI。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # 播放重试 / 媒体类型判定（见 features/iptv/application）直接消费
  # media_kit 的 Tracks / AudioParams 事件，与两个宿主使用同一版本。
  media_kit: ^1.2.6

  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  pretty_dio_logger: ^1.4.0
  cookie_jar: ^4.0.9
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.1
  crypto: ^3.0.6
  package_info_plus: ^10.2.1
  # 实时消息通道（自建 WebSocket 网关）
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  fake_async: ^1.3.0

flutter:
  # 共享包自己的数据资产。作为依赖被引入时，flutter_tools 会展开该目录并给资产键
  # 加上 `packages/pscreen_screen/` 前缀，宿主因此**不需要**再声明这份资产
  # （宿主若用目录通配声明，会被解析成 <宿主目录>/packages/… 而构建失败）。
  assets:
    - assets/datas/
